<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#030108">
<meta name="description" content="Все мои ссылки в одном месте.">
<title>Наначи — ссылки</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030108;
    --card:rgba(10,8,24,.42);
    --border:rgba(255,255,255,.09);
    --text:#eef1f7;
    --muted:#9aa3b5;
    --accent:#7c5cff;
    --accent2:#38e0c8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ── общая структура: два экрана ── */
  .screen{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
    position:relative;
  }
  .screen-top{transition:background .4s ease}

  /* ── карточка ── */
  .card{
    width:100%;max-width:460px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:28px;
    padding:40px 28px 28px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    text-align:center;
    /* уход при прокрутке: растворяется и отлетает вглубь */
    transform-origin:top center;
    transition:transform .1s linear, opacity .1s linear, filter .1s linear;
    will-change:transform, opacity, filter;
  }

  /* ── аватар ── */
  .avatar{
    width:104px;height:104px;margin:0 auto 20px;
    border-radius:50%;padding:3px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 40px rgba(124,92,255,.35);
  }
  /* Чтобы поставить своё фото — замени содержимое .avatar-inner на:
     <img src="photo.jpg" alt=""> (и в CSS: .avatar-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}) */
  .avatar-inner{
    width:100%;height:100%;border-radius:50%;
    background:#12151d;
    display:flex;align-items:center;justify-content:center;
    font-family:'Unbounded',sans-serif;font-size:36px;color:#fff;
  }
  .avatar-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

  h1{
    font-family:'Unbounded',sans-serif;
    font-size:26px;font-weight:700;letter-spacing:.01em;
  }
  .handle{color:var(--muted);font-size:14px;margin-top:6px;font-weight:500}

  /* ── плашка про синтез речи (главный акцент карточки) ── */
  .note{
    display:flex;gap:16px;align-items:center;
    text-align:left;
    background:linear-gradient(135deg, rgba(124,92,255,.22), rgba(56,224,200,.14));
    border:1px solid rgba(124,92,255,.55);
    padding:20px 18px;
    border-radius:20px;
    font-size:17px;line-height:1.5;font-weight:700;color:#fff;
    margin:26px 0;
    box-shadow:0 0 26px rgba(124,92,255,.35), inset 0 0 18px rgba(124,92,255,.12);
    order:-1; /* плашка поднимается выше ссылок */
  }
  /* мини-эквалайзер = синтез речи */
  .eq{display:flex;align-items:flex-end;gap:4px;height:28px;flex-shrink:0}
  .eq span{
    width:5px;border-radius:3px;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    animation:eq 1.2s ease-in-out infinite;
    transform-origin:bottom;
  }
  .eq span:nth-child(1){height:60%;animation-delay:0s}
  .eq span:nth-child(2){height:100%;animation-delay:.15s}
  .eq span:nth-child(3){height:40%;animation-delay:.3s}
  .eq span:nth-child(4){height:80%;animation-delay:.45s}
  @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

  /* ── ссылки ── */
  .links{display:flex;flex-direction:column;gap:12px}
  .link{
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    border-radius:16px;
    color:var(--text);text-decoration:none;
    font-weight:700;font-size:15.5px;
    transition:transform .25s,background .25s,border-color .25s,box-shadow .25s;
  }
  .link:hover{
    transform:translateY(-2px);
    border-color:rgba(124,92,255,.55);
    background:rgba(124,92,255,.10);
    box-shadow:0 10px 30px rgba(124,92,255,.15);
  }
  .link svg{width:22px;height:22px;flex-shrink:0;color:var(--accent2)}
  .link .arrow{margin-left:auto;opacity:0;transition:.25s;color:var(--muted)}
  .link:hover .arrow{opacity:1;transform:translateX(3px)}

  footer{margin-top:28px;color:var(--muted);font-size:12.5px}

  /* ── появление ── */
  .card>*{animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
  .card>*:nth-child(1){animation-delay:.05s}
  .card>*:nth-child(2){animation-delay:.12s}
  .card>*:nth-child(3){animation-delay:.18s}
  .card>*:nth-child(4){animation-delay:.24s}
  .card>*:nth-child(5){animation-delay:.30s}
  .card>*:nth-child(6){animation-delay:.36s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (max-width:420px){
    .card{padding:32px 20px 22px}
    h1{font-size:22px}
  }

  /* ═══════════ ФОН: галактика (galaxy.js) ═══════════ */
  #space, #dust{
    position:fixed;inset:0;width:100vw;height:100vh;
    display:block;pointer-events:none;
  }
  #space{z-index:0}
  #dust{z-index:1;mix-blend-mode:screen}
  .screen{z-index:2}

  /* ═══════════ ЭКРАН 2: сферы в цветах галактики ═══════════ */
  .space{background:transparent}
  /* пустая дистанция между сферами и системой: только галактика */
  .travel{
    height:60vh;
    pointer-events:none;
  }
  /* галактика приглушается при наведении на сферу */
  #space, #dust{transition:filter .4s}
  body:has(.sphere:hover) #space, body:has(.sphere:hover) #dust{filter:brightness(.35) saturate(.5)}

  .sphere{
    position:absolute;
    border-radius:50%;
    cursor:pointer;
    z-index:2;
    transition:filter .3s, box-shadow .3s, scale .3s, opacity .35s;
  }
  .sphere:hover{
    filter:brightness(1.35);
    scale:1.15;
    box-shadow:0 0 0 3px rgba(255,255,255,.3), 0 0 46px rgba(255,255,255,.55);
  }
  /* при наведении остальные тускнеют */
  .space:has(.sphere:hover) .sphere:not(:hover){opacity:.22;filter:blur(1px)}

  /* подпись при наведении */
  .sphere::after{
    content:attr(data-name);
    position:absolute;top:calc(100% + 14px);left:50%;
    transform:translateX(-50%);
    font-size:14px;font-weight:700;white-space:nowrap;
    color:#fff;text-shadow:0 0 12px #000;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .sphere:hover::after{opacity:1}

  /* цвета — прямо из палитры галактики */
  .sp-1{ /* горячий розовый */
    width:82px;height:82px;top:20%;left:16%;
    background:radial-gradient(circle at 34% 30%, #ffd6f0, #ff52d1 55%, #8f1f68 88%);
    box-shadow:inset -14px -18px 30px rgba(120,10,70,.5), 0 0 40px rgba(255,82,209,.5);
    animation:drift1 14s ease-in-out infinite;
  }
  .sp-2{ /* фиолетовый */
    width:104px;height:104px;top:28%;right:14%;
    background:radial-gradient(circle at 34% 30%, #e8d4ff, #9e52ff 55%, #3d1d80 88%);
    box-shadow:inset -18px -22px 36px rgba(50,15,110,.55), 0 0 46px rgba(158,82,255,.55);
    animation:drift2 18s ease-in-out infinite;
  }
  .sp-3{ /* бирюзовый */
    width:66px;height:66px;bottom:26%;left:24%;
    background:radial-gradient(circle at 34% 30%, #d4f6ff, #40d9ff 55%, #0e5e80 88%);
    box-shadow:inset -11px -14px 24px rgba(10,70,100,.55), 0 0 36px rgba(64,217,255,.55);
    animation:drift3 12s ease-in-out infinite;
  }
  .sp-4{ /* голубой */
    width:128px;height:128px;bottom:16%;right:20%;
    background:radial-gradient(circle at 34% 30%, #e6eeff, #8cb3ff 55%, #2c4a8f 88%);
    box-shadow:inset -22px -28px 44px rgba(30,50,110,.55), 0 0 52px rgba(140,179,255,.55);
    animation:drift1 22s ease-in-out infinite reverse;
  }
  .sphere:hover{animation-play-state:paused}
  @keyframes drift1{0%,100%{translate:0 0}50%{translate:16px -22px}}
  @keyframes drift2{0%,100%{translate:0 0}50%{translate:-20px 16px}}
  @keyframes drift3{0%,100%{translate:0 0}50%{translate:14px 18px}}

  /* часы по центру (МСК+6) с перелистывающимися цифрами */
  .clock{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-family:'Unbounded',sans-serif;
    font-size:clamp(30px,8vw,48px);
    font-weight:700;
    color:#fff;
    letter-spacing:.05em;
    text-shadow:0 0 18px rgba(160,180,255,.55), 0 0 48px rgba(124,92,255,.45);
    pointer-events:none;
    z-index:1;
    font-variant-numeric:tabular-nums;
  }
  .clock-caption{
    position:absolute;top:calc(50% + 58px);left:50%;
    transform:translateX(-50%);
    font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(232,222,255,.6);
    text-shadow:0 0 10px #000;
    pointer-events:none;
    white-space:nowrap;
    z-index:1;
  }
  /* каждая цифра — карточка; при смене старая улетает вверх, новая прилетает снизу */
  .flip{
    display:inline-block;
    position:relative;
    width:.72em;
    height:1.28em;
    overflow:hidden;
    vertical-align:top;
  }
  .flip .roll{
    position:absolute;left:0;top:0;
    width:100%;height:200%;
    display:flex;flex-direction:column;
    align-items:center;
    transition:transform .45s cubic-bezier(.3,.9,.35,1.1);
  }
  .flip .roll span{
    height:50%;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .clock .sep{
    display:inline-block;
    width:.34em;
    text-align:center;
    animation:blink 2s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:.25}}

  /* ═══════════ ЭКРАН 3: система планет на фоне галактики ═══════════ */
  .earth-screen{background:transparent}

  .star-link{z-index:3}
  /* при наведении на планету галактика притушивается */
  body.planet-hover #space, body.planet-hover #dust{filter:brightness(.35) saturate(.5)}

  /* canvas систем ВНУТРИ секций: едут вместе со страницей.
     Расширен запасом ~10% высоты вверх и вниз — свечения и орбиты
     не обрезаются краями, даже если страница не докручена */
  .sys-canvas{
    position:absolute;
    left:0;right:0;
    top:-10%;bottom:-10%;
    width:100%;height:120%;
    pointer-events:none;
  }
  /* ссылки-планеты: absolute внутри секции earth, после canvas в DOM */
  .p-link{
    position:absolute;
    border-radius:50%;
    transform:translate(-50%,-50%);
    cursor:pointer;
  }
  .p-link::after{
    content:attr(data-name);
    position:absolute;top:calc(100% + 8px);left:50%;
    transform:translateX(-50%);
    font-size:13px;font-weight:700;white-space:nowrap;
    color:#fff;text-shadow:0 0 12px #000;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .p-link:hover::after{opacity:1}

  /* звёзды-рикролы */
  .star-link{
    position:absolute;z-index:3;
    width:7px;height:7px;border-radius:50%;background:#fff;
    box-shadow:0 0 10px #fff, 0 0 22px rgba(160,180,255,.8);
    animation:twinkle 3s ease-in-out infinite;
    cursor:pointer!important;
  }
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

  /* ── стрелка «листай вниз» ── */
  .down{
    position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    color:var(--muted);text-decoration:none;font-size:26px;line-height:1;
    animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
</style>
</head>

<script>
  const earth = document.getElementById('earth');

  // 4 звезды-приколы: ведут на рикрол.
  // Позиции зависят от текущего часа: в течение часа стоят на месте,
  // каждый новый час переезжают (24 расстановки в сутки).
  const hour = new Date().getHours();
  // мини-ГПСЧ с сидом от часа
  let seed = hour * 7919 + 13;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  // 4 сектора неба (верх-низ × лево-право) — по звезде в каждом
  const zones = [[0, 0], [50, 0], [0, 50], [50, 50]];
  zones.forEach(([zx, zy]) => {
    const a = document.createElement('a');
    a.className = 'star-link';
    a.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = '✨';
    a.style.top = (zy + 6 + rand() * 36) + '%';
    a.style.left = (zx + 6 + rand() * 36) + '%';
    a.style.animationDelay = (rand() * 3) + 's';
    a.style.animationDuration = (2.5 + rand() * 2) + 's';
    earth.appendChild(a);
  });

  // ═══ Часы по центру второго экрана: МСК+6 (= UTC+9), flip-цифры ═══
  // каждая цифра — карточка с «роликом»: при смене значения лента
  // прокатывается, старая цифра улетает вверх, новая прилетает снизу
  const clockEl = document.getElementById('clock');
  const rolls = [...clockEl.querySelectorAll('.roll')];
  function setRoll(roll, val) {
    const cur = roll.children[1].textContent;
    const next = String(val);
    if (cur === next) return;
    roll.children[1].textContent = next;          // нижняя (целевая)
    roll.children[0].textContent = cur;           // верхняя (старая)
    roll.style.transition = 'none';
    roll.style.transform = 'translateY(0)';
    void roll.offsetHeight;                       // reflow: сброс без анимации
    roll.style.transition = '';
    roll.style.transform = 'translateY(-50%)';    // плавный прокат
  }
  function tickClock() {
    const t = new Date(Date.now() + 9 * 3600 * 1000);
    const h = String(t.getUTCHours()).padStart(2, '0');
    const m = String(t.getUTCMinutes()).padStart(2, '0');
    const s = String(t.getUTCSeconds()).padStart(2, '0');
    setRoll(rolls[0], h[0]); setRoll(rolls[1], h[1]);
    setRoll(rolls[2], m[0]); setRoll(rolls[3], m[1]);
    setRoll(rolls[4], s[0]); setRoll(rolls[5], s[1]);
  }
  // первичная установка без анимации
  rolls.forEach(r => { r.style.transition = 'none'; });
  tickClock();
  rolls.forEach(r => { r.style.transform = 'translateY(-50%)'; void r.offsetHeight; r.style.transition = ''; });
  setInterval(tickClock, 250);

  // ═══ Две системы планет: мини (вокруг часов, экран 2) и большая (экран 3).
  // Обе рисуются в canvas ВНУТРИ своих секций — едут вместе со страницей,
  // никакой синхронизации со скроллом: прыгать и запаздывать нечему ═══
  const PLANET_DEFS = [
    { size: 32, dist: 0.34, speed: .055, phase: .6,  top:'#f0f0f0', mid:'#b8b8b8', bot:'#5a5a5a', glow:'220,220,220', link:null },
    { size: 46, dist: 0.54, speed: .034, phase: 2.4, top:'#ffd6f0', mid:'#ff52d1', bot:'#701a52', glow:'255,82,209', link:'pl-donat' },
    { size: 38, dist: 0.76, speed: .022, phase: 4.1, top:'#d4f6ff', mid:'#40d9ff', bot:'#0c4a66', glow:'64,217,255', link:'pl-fetta' },
    { size: 62, dist: 1.00, speed: .014, phase: 5.3, top:'#e8d4ff', mid:'#9e52ff', bot:'#301560', glow:'158,82,255', link:null },
  ];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function drawStar(ctx, cx, cy, r, dim, base) {
    ctx.globalAlpha = base * (dim ? .6 : 1);
    const g = ctx.createRadialGradient(cx - r * .28, cy - r * .3, r * .05, cx, cy, r);
    g.addColorStop(0, '#fffce8'); g.addColorStop(.4, '#ffe45c');
    g.addColorStop(.72, '#ffb62e'); g.addColorStop(1, '#ff7a1a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = base;
  }

  function drawPlanet(ctx, p, cx, cy, anyHover, base, unit) {
    const others = anyHover && !p.hover;
    const alpha = base * (others ? .3 : 1);
    const r = Math.max(2, p.size * unit * (1 + .18 * p.hovT));
    if (p.hovT > .02) {
      const gl = ctx.createRadialGradient(p.x, p.y, r * .8, p.x, p.y, r * 2.4);
      gl.addColorStop(0, 'rgba(' + p.glow + ',' + (.5 * p.hovT) + ')');
      gl.addColorStop(1, 'rgba(' + p.glow + ',0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.4, 0, Math.PI * 2); ctx.fill();
    }
    let dx = cx - p.x, dy = cy - p.y;
    const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(p.x + dx * r * .45, p.y + dy * r * .45, r * .12, p.x, p.y, r);
    g.addColorStop(0, p.top); g.addColorStop(.55, p.mid); g.addColorStop(1, p.bot);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    if (p.hovT > .02) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (.55 * p.hovT) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 4, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = base;
  }

  function makeSystem(canvas, stateFn, cxRatio, withLinks) {
    const ctx = canvas.getContext('2d');
    const planets = PLANET_DEFS.map(d => Object.assign({}, d, {
      angle: d.phase, hover: false, hovT: 0,
      el: (withLinks && d.link) ? document.getElementById(d.link) : null
    }));
    planets.forEach(p => {
      if (!p.el) return;
      p.el.addEventListener('mouseenter', () => { p.hover = true; document.body.classList.add('planet-hover'); });
      p.el.addEventListener('mouseleave', () => { p.hover = false; document.body.classList.remove('planet-hover'); });
    });
    let W = 0, H = 0, PAD = 0;
    function resize() {
      const r = canvas.parentElement.getBoundingClientRect();
      W = r.width; H = r.height;
      PAD = Math.round(H * .1);   // согласовано с CSS: top:-10%, height:120%
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round((H + PAD * 2) * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    let last = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(64, now - last) / 1000; last = now;
      if (!W) { resize(); return; }
      const st = stateFn();
      if (st.alpha <= 0.01) { ctx.clearRect(0, 0, W, H + PAD * 2); return; }

      // центр системы = центр секции (canvas расширен запасом PAD сверху)
      const cx = W * cxRatio, cy = PAD + H / 2;
      const outer = Math.min(W * .8, H * 1.05) * st.scale;
      const tilt = .62;
      const pulse = .85 + .15 * Math.sin(now * .0013);

      const anyHover = planets.some(p => p.hover);
      planets.forEach(p => {
        if (!reduced && !p.hover) p.angle += p.speed * dt;
        p.hovT += ((p.hover ? 1 : 0) - p.hovT) * Math.min(1, dt * 8);
        p.x = cx + Math.cos(p.angle) * p.dist * outer;
        p.y = cy + Math.sin(p.angle) * p.dist * outer * tilt;
      });

      ctx.clearRect(0, 0, W, H + PAD * 2);
      ctx.globalAlpha = st.alpha;

      // орбиты
      planets.forEach(p => {
        ctx.strokeStyle = 'rgba(255,255,255,' + (.1 * (anyHover ? .35 : 1)) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(cx, cy, p.dist * outer, p.dist * outer * tilt, 0, 0, Math.PI * 2);
        ctx.stroke();
      });

      // свечение звезды
      const starR = Math.min(W, H) * .09 * st.scale;
      const glowR = Math.max(starR, 14);
      [[2.2, .5], [4.5, .22], [8, .1]].forEach(([k, a]) => {
        const g = ctx.createRadialGradient(cx, cy, glowR * .2, cx, cy, glowR * k);
        g.addColorStop(0, 'rgba(255,200,90,' + (a * pulse) + ')');
        g.addColorStop(1, 'rgba(255,140,40,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, glowR * k, 0, Math.PI * 2); ctx.fill();
      });

      // планеты, уходящие вверх орбиты, прячутся за звездой
      const order = [...planets].sort((a, b) => a.y - b.y);
      let starDrawn = false;
      order.forEach(p => {
        if (!starDrawn && p.y > cy) { drawStar(ctx, cx, cy, starR, anyHover, st.alpha); starDrawn = true; }
        drawPlanet(ctx, p, cx, cy, anyHover, st.alpha, st.scale);
      });
      if (!starDrawn) drawStar(ctx, cx, cy, starR, anyHover, st.alpha);

      // ссылки-планеты двигаются за планетами (в координатах секции:
      // canvas сдвинут на -PAD, компенсируем)
      planets.forEach(p => {
        if (!p.el) return;
        const d = Math.max(10, p.size * 2.4 * st.scale);
        p.el.style.left = p.x + 'px';
        p.el.style.top = (p.y - PAD) + 'px';
        p.el.style.width = d + 'px';
        p.el.style.height = d + 'px';
        p.el.style.pointerEvents = (st.scale > .7) ? 'auto' : 'none';
      });
    }
    requestAnimationFrame(frame);
  }

  // мини-система: живёт в потоке экрана 2, вокруг часов (цифры поверх), не кликабельна
  makeSystem(document.getElementById('mini'), () => ({ scale: .16, alpha: 1 }), .5, false);

  // большая система: появляется с входом экрана 3 в кадр и растёт до конца страницы
  const earthSec = document.getElementById('earth');
  let earthTop = 0;
  function measureEarth() { earthTop = earthSec.getBoundingClientRect().top + scrollY; }
  measureEarth();
  addEventListener('resize', measureEarth);
  makeSystem(document.getElementById('system'), () => {
    const vh = innerHeight;
    // старт: экран 3 полностью вошёл в кадр; финиш: конец страницы
    const p = Math.min(1, Math.max(0, (scrollY - (earthTop - vh)) / (vh * 1.0)));
    const g = p * p;                     // разгон: медленно → резко
    return { scale: .12 + .88 * g, alpha: Math.min(1, p * 2) };
  }, .36, true);

  const card = document.querySelector('.card');
  const spheres = document.querySelectorAll('.sphere');
  const down = document.querySelector('.down');
  // сферам запрещаем влетать, пока не пройдена половина второго экрана
  function onScrollFX() {
    const vh = innerHeight;
    const p = Math.min(1, Math.max(0, scrollY / (vh * .85)));

    // карточка уменьшается, размывается и растворяется — «отлетаем в космос»
    card.style.transform = 'perspective(900px) scale(' + (1 - p * .35) + ') translateY(' + (-p * 60) + 'px)';
    card.style.opacity = 1 - p * 1.15;
    card.style.filter = 'blur(' + (p * 14) + 'px)';

    // стрелка гаснет быстрее карточки
    if (down) down.style.opacity = Math.max(0, 1 - p * 2.2);

    // сферы влетают, когда первый экран почти пройден
    spheres.forEach((s, i) => {
      const q = Math.min(1, Math.max(0, (scrollY - vh * .3) / (vh * .5)));
      const lag = q * 1.25 - i * .07;
      const e = Math.min(1, Math.max(0, lag));
      const ease = 1 - Math.pow(1 - e, 3);
      s.style.opacity = ease;
      s.style.translate = 0 + ' ' + ((1 - ease) * 140) + 'px';
      s.style.scale = (.7 + ease * .3);
    });
  }
  addEventListener('scroll', onScrollFX, { passive: true });
  addEventListener('resize', onScrollFX);
  onScrollFX();
</script>
<script src="galaxy.js"></script>

</body>
</html>
